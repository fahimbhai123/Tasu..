<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Neha! 🎉</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Pacifico&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    min-height:100%;
}

body{
    font-family:'Poppins',sans-serif;
    background:
        radial-gradient(circle at 20% 20%,rgba(255,80,140,.18),transparent 30%),
        radial-gradient(circle at 80% 70%,rgba(120,80,255,.18),transparent 30%),
        linear-gradient(135deg,#09071a,#171032,#09071a);
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    position:relative;
}

/* =========================
   BACKGROUND
========================= */

.bg-glow{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-5;
    background:
        radial-gradient(circle at 50% 45%,rgba(255,117,140,.12),transparent 35%);
    animation:bgPulse 4s infinite alternate;
}

@keyframes bgPulse{
    from{opacity:.5;transform:scale(1);}
    to{opacity:1;transform:scale(1.08);}
}

.stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-4;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:#fff;
    border-radius:50%;
    box-shadow:0 0 8px #fff;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.15;transform:scale(.6);}
    to{opacity:1;transform:scale(1.5);}
}

/* Floating hearts */

.floating-heart{
    position:fixed;
    bottom:-50px;
    font-size:25px;
    pointer-events:none;
    z-index:1;
    animation:heartFloat linear forwards;
    filter:drop-shadow(0 0 8px rgba(255,80,130,.8));
}

@keyframes heartFloat{
    0%{
        transform:translateY(0) rotate(0deg) scale(.7);
        opacity:0;
    }
    10%{opacity:1;}
    90%{opacity:1;}
    100%{
        transform:translateY(-110vh) rotate(360deg) scale(1.4);
        opacity:0;
    }
}

/* =========================
   CONTAINER / CARD
========================= */

.container{
    width:100%;
    max-width:620px;
    margin:auto;
    position:relative;
    z-index:5;
}

.card{
    width:100%;
    background:rgba(255,255,255,.065);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,.14);
    border-radius:30px;
    padding:40px 30px;
    box-shadow:
        0 30px 80px rgba(0,0,0,.65),
        inset 0 1px 1px rgba(255,255,255,.18);
    text-align:center;
    animation:cardIn 1s cubic-bezier(.16,1,.3,1);
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(40px) scale(.85);
        filter:blur(10px);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
        filter:blur(0);
    }
}

.hidden{
    display:none!important;
}

.visible{
    display:block!important;
    animation:cardIn .8s cubic-bezier(.16,1,.3,1);
}

h1{
    font-family:'Playfair Display',serif;
    color:#ff7b9c;
    font-size:2.35rem;
    line-height:1.2;
    margin-bottom:16px;
    text-shadow:
        0 0 15px rgba(255,117,140,.45),
        0 0 35px rgba(255,117,140,.2);
}

p{
    color:#e7e7e7;
    font-size:1.03rem;
    line-height:1.75;
    margin-bottom:18px;
}

.highlight-text{
    color:#ffe95b;
    font-style:italic;
    font-weight:500;
    text-shadow:0 0 12px rgba(255,235,59,.35);
}

.heart{
    display:inline-block;
    color:#ff557e;
    animation:heartBeat 1.2s infinite;
}

@keyframes heartBeat{
    0%,100%{transform:scale(1);}
    50%{
        transform:scale(1.35);
        filter:drop-shadow(0 0 12px #ff557e);
    }
}

.birthday-stickers{
    font-size:2rem;
    margin-bottom:12px;
    letter-spacing:5px;
    animation:stickerFloat 2s infinite ease-in-out;
}

@keyframes stickerFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-9px);}
}

/* =========================
   BUTTON
========================= */

.btn{
    border:none;
    outline:none;
    cursor:pointer;
    color:#fff;
    font-family:'Poppins',sans-serif;
    font-size:1rem;
    font-weight:600;
    padding:15px 32px;
    border-radius:50px;
    background:linear-gradient(135deg,#ff5f86,#ff7eb3);
    box-shadow:
        0 10px 30px rgba(255,80,130,.4),
        inset 0 1px 1px rgba(255,255,255,.3);
    transition:.3s ease;
    margin-top:8px;
}

.btn:hover{
    transform:translateY(-4px) scale(1.04);
    box-shadow:0 15px 40px rgba(255,80,130,.65);
}

.btn:active{
    transform:scale(.96);
}

/* =========================
   SCANNER
========================= */

.scanner-pad{
    display:inline-block;
    padding:15px;
    background:rgba(0,0,0,.3);
    border-radius:50%;
    border:1px dashed rgba(255,117,140,.5);
    margin-bottom:15px;
    cursor:pointer;
}

.scanner-glow{
    width:85px;
    height:85px;
    border:4px solid rgba(255,117,140,.18);
    border-top-color:#ff758c;
    border-right-color:#ff758c;
    border-radius:50%;
    animation:
        scannerSpin 1.2s linear infinite,
        scannerGlow 2s infinite alternate;
}

@keyframes scannerSpin{
    to{transform:rotate(360deg);}
}

@keyframes scannerGlow{
    from{box-shadow:0 0 8px rgba(255,117,140,.2);}
    to{box-shadow:0 0 35px rgba(255,117,140,.9);}
}

/* =========================
   PHOTO
========================= */

.photo-gallery-container{
    margin:22px 0;
}

.photo-card-item{
    background:rgba(0,0,0,.35);
    padding:14px;
    border-radius:22px;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.photo-frame{
    width:100%;
    height:360px;
    border-radius:16px;
    overflow:hidden;
    background:#000;
    border:1px solid rgba(255,117,140,.35);
    position:relative;
}

.photo-frame::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:linear-gradient(
        120deg,
        transparent 35%,
        rgba(255,255,255,.15) 50%,
        transparent 65%
    );
    animation:photoShine 4s infinite;
}

@keyframes photoShine{
    0%,55%{transform:translateX(-100%);}
    100%{transform:translateX(100%);}
}

.photo-frame img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.photo-caption{
    margin-top:13px;
    margin-bottom:0;
    color:#ffe95b;
    font-style:italic;
}

/* =========================
   WEATHER
========================= */

.weather-widget{
    background:rgba(0,0,0,.42);
    border-radius:22px;
    padding:22px;
    margin:20px 0;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:inset 0 2px 15px rgba(0,0,0,.5);
    text-align:left;
}

.weather-header{
    display:flex;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid rgba(255,255,255,.1);
    padding-bottom:12px;
    margin-bottom:15px;
    color:#ff7eb3;
    font-size:.9rem;
}

.weather-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin:12px 0;
    font-size:.93rem;
}

.weather-label{
    color:#aaa;
}

.weather-val{
    color:#ffe95b;
    font-weight:600;
    text-align:right;
}

/* =========================
   PREMIUM CAKE
========================= */

.cake-scene{
    position:relative;
    width:320px;
    height:330px;
    margin:15px auto 5px;
    cursor:pointer;
}

.cake-scene::before{
    content:"";
    position:absolute;
    width:290px;
    height:80px;
    left:50%;
    bottom:15px;
    transform:translateX(-50%);
    background:rgba(255,80,130,.18);
    filter:blur(30px);
